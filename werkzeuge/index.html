<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkzeugübersicht für Lehrende</title>
<style>
:root {
  --rot: #E60028; --rot-text: #C4001F; --rot-zart: #FDE8EB;
  --text: #1d1d1f; --leise: #5f5f64; --grund: #F5F5F7; --karte: #ffffff; --linie: #e3e3e8;
  --fokus: #0058B0; --ki: #5B3CC4; --ki-zart: #EEE9FB;
  --schatten: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --rot: #FF4D66; --rot-text: #FF8596; --rot-zart: #3A1A20;
    --text: #f5f5f7; --leise: #a8a8ad; --grund: #000; --karte: #1c1c1e; --linie: #38383b;
    --fokus: #64A8FF; --ki: #C3B3FF; --ki-zart: #2A2340; --schatten: none;
  }
}
@media (prefers-contrast: more) { :root { --linie: currentColor; --leise: var(--text); } }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Liberation Sans", sans-serif; color: var(--text); background: var(--grund); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--rot-text); }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 3px; }
.huelle { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }
svg.ic { width: 1.25em; height: 1.25em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }

header.kopf { background: var(--karte); border-bottom: 1px solid var(--linie); }
.kopfzeile { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 0.9rem 0; }
.marke { display: flex; gap: 0.75rem; align-items: center; }
.marke .punkt { width: 8px; height: 38px; border-radius: 4px; background: var(--rot); }
.marke h1 { font-size: 1.15rem; margin: 0; }
.marke p { margin: 0; color: var(--leise); font-size: 0.9rem; }
.knoepfe { display: flex; gap: 0.4rem; flex-wrap: wrap; }
button, .knopf { font: inherit; min-height: 44px; min-width: 44px; padding: 0.45rem 0.9rem; border-radius: 999px; border: 1px solid var(--linie); background: var(--karte); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; text-decoration: none; }
button:hover, .knopf:hover { border-color: var(--leise); }
button[aria-pressed="true"] { background: var(--text); color: var(--karte); border-color: var(--text); }

nav.reiter { display: flex; gap: 0.25rem; padding: 0.25rem; background: var(--linie); border-radius: 999px; width: fit-content; margin: 1.5rem 0 0.5rem; max-width: 100%; overflow-x: auto; }
nav.reiter button { border: 0; background: transparent; white-space: nowrap; }
nav.reiter button[aria-selected="true"] { background: var(--karte); color: var(--text); box-shadow: var(--schatten); font-weight: 600; }

h2.gross { font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.15; margin: 1.5rem 0 0.25rem; letter-spacing: -0.02em; }
.einleitung { color: var(--leise); margin: 0 0 1.5rem; font-size: 1.05rem; }

.ziele { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.ziel { font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--karte); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--schatten); border: 1px solid var(--linie); display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 0.5rem; min-height: 180px; }
.ziel:hover { border-color: var(--rot); }
.kreis { width: 52px; height: 52px; border-radius: 16px; background: var(--rot-zart); color: var(--rot-text); display: grid; place-items: center; }
.kreis svg.ic { width: 28px; height: 28px; }
.ziel strong { font-size: 1.15rem; }
.ziel span.f { color: var(--leise); }
.ziel .weiter { margin-top: auto; color: var(--rot-text); font-weight: 600; display: flex; align-items: center; gap: 0.3rem; }

.zurueck { margin: 1rem 0 0; }
.detailkopf { display: flex; gap: 1rem; align-items: center; margin: 1.25rem 0 1rem; }
.detailkopf .kreis { width: 72px; height: 72px; border-radius: 22px; }
.detailkopf .kreis svg.ic { width: 40px; height: 40px; }
.detailkopf h2 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: -0.02em; }
.detailkopf p { margin: 0.15rem 0 0; color: var(--leise); font-size: 1.05rem; }
.paar { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.box { background: var(--karte); border-radius: var(--radius); padding: 1rem 1.2rem; border: 1px solid var(--linie); display: flex; gap: 0.8rem; align-items: flex-start; }
.box > svg.ic { color: var(--rot-text); width: 1.5rem; height: 1.5rem; margin-top: 0.1rem; }
.box b { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--leise); }
h3.abschnitt { font-size: 1.2rem; margin: 1.75rem 0 0.75rem; }

.werkzeuge { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.wz { background: var(--karte); border-radius: var(--radius); padding: 1.1rem 1.2rem; border: 1px solid var(--linie); box-shadow: var(--schatten); display: flex; flex-direction: column; gap: 0.5rem; }
.wz .oben { display: flex; gap: 0.8rem; align-items: center; }
.wz .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--grund); display: grid; place-items: center; flex: none; }
.wz .icon svg.ic { width: 24px; height: 24px; }
.wz.ki .icon { background: var(--ki-zart); color: var(--ki); }
.wz h4 { margin: 0; font-size: 1.05rem; line-height: 1.25; }
.wz .was { margin: 0; font-size: 1rem; }
.wz .was b { font-weight: 600; }
.etiketten { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; font-size: 0.85rem; color: var(--leise); }
.pille { border-radius: 999px; padding: 0.1rem 0.6rem; background: var(--grund); white-space: nowrap; }
.pille.ki { background: var(--ki-zart); color: var(--ki); font-weight: 600; }
.aufwand { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.aufwand i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--text); display: inline-block; }
.aufwand i.an { background: var(--text); }
.aufwand span { margin-left: 0.3rem; }
.wz details summary { cursor: pointer; color: var(--rot-text); min-height: 44px; display: flex; align-items: center; font-weight: 600; }
.wz dl { margin: 0; display: grid; gap: 0.5rem; }
.wz dt { font-size: 0.8rem; color: var(--leise); text-transform: uppercase; letter-spacing: 0.05em; }
.wz dd { margin: 0; }
.wz .klein { font-size: 0.85rem; color: var(--leise); margin: 0.5rem 0 0; }
.gutfuer { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; font-size: 0.85rem; color: var(--leise); }
.gutfuer span.z { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--rot-zart); color: var(--rot-text); border-radius: 999px; padding: 0.15rem 0.6rem; }
.gutfuer span.z svg.ic { width: 1rem; height: 1rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chips span { display: inline-flex; gap: 0.4rem; align-items: center; background: var(--karte); border: 1px solid var(--linie); border-radius: 999px; padding: 0.4rem 0.85rem; }
.chips.leise span { color: var(--leise); border-style: dashed; }
.regeln { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin: 0 0 2rem; }
h3.gruppe { margin: 2rem 0 0.75rem; font-size: 1.2rem; }

.text { background: var(--karte); border-radius: var(--radius); padding: 1.25rem 1.5rem; border: 1px solid var(--linie); margin-bottom: 1rem; max-width: 860px; }
.text h3 { margin-top: 0; }
.rahmen { overflow-x: auto; }
table.matrix { border-collapse: separate; border-spacing: 4px; font-size: 0.9rem; }
table.matrix th { text-align: left; font-weight: 600; padding: 0.25rem 0.5rem; }
table.matrix td { min-width: 3.6rem; height: 2.4rem; text-align: center; border-radius: 8px; background: var(--grund); color: var(--leise); }
table.matrix td.voll { color: #fff; font-weight: 700; background: #333; }

footer { color: var(--leise); font-size: 0.85rem; padding: 2rem 0 3rem; }
.unsichtbar { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .ziel, button { transition: border-color .15s, background-color .15s; } }
@media print { .knoepfe, nav.reiter, .zurueck { display: none !important; } body { background: #fff; } .wz, .ziel, .box { box-shadow: none; break-inside: avoid; } details > * { display: block !important; } }
</style>
</head>
<body>
<header class="kopf">
  <div class="huelle kopfzeile">
    <div class="marke"><span class="punkt" aria-hidden="true"></span>
      <div><h1 id="titel"></h1><p id="untertitel"></p></div></div>
    <div class="knoepfe">
      <span role="group" id="sprachgruppe" style="display:flex;gap:.4rem">
        <button type="button" data-lang="de" lang="de" aria-label="Deutsch">DE</button>
        <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
      </span>
      <a class="knopf" id="plakat" href="plakat-de.pdf"></a>
    </div>
  </div>
</header>

<main class="huelle">
  <nav class="reiter" role="tablist" id="reiter">
    <button type="button" role="tab" data-view="ziel" id="tab-ziel"></button>
    <button type="button" role="tab" data-view="werkzeuge" id="tab-werkzeuge"></button>
    <button type="button" role="tab" data-view="hintergrund" id="tab-hintergrund"></button>
  </nav>
  <div id="inhalt" tabindex="-1"></div>
</main>
<footer><div class="huelle" id="fuss"></div></footer>

<script>
const D = {"stand":"2026-11-04","titel":{"de":"Werkzeugübersicht für Lehrende","en":"Tool guide for teachers"},"untertitel":{"de":"Erst das Ziel, dann das Werkzeug","en":"Goal first, then the tool"},"stufen":[{"id":1,"de":"Erinnern","en":"Remember","verben_de":"nennen, benennen, aufzählen","verben_en":"name, list, recall"},{"id":2,"de":"Verstehen","en":"Understand","verben_de":"erklären, beschreiben, einordnen","verben_en":"explain, describe, classify"},{"id":3,"de":"Anwenden","en":"Apply","verben_de":"berechnen, durchführen, nutzen","verben_en":"calculate, carry out, use"},{"id":4,"de":"Analysieren","en":"Analyse","verben_de":"zerlegen, vergleichen, unterscheiden","verben_en":"break down, compare, distinguish"},{"id":5,"de":"Bewerten","en":"Evaluate","verben_de":"prüfen, beurteilen, begründen","verben_en":"check, judge, justify"},{"id":6,"de":"Erschaffen","en":"Create","verben_de":"entwerfen, entwickeln, gestalten","verben_en":"design, develop, produce"}],"wissen":[{"id":"F","de":"Faktenwissen","en":"Factual","erkl_de":"Begriffe, Einzelheiten, Kennwerte","erkl_en":"terms, details, values"},{"id":"K","de":"Konzeptuelles Wissen","en":"Conceptual","erkl_de":"Zusammenhänge, Modelle, Prinzipien","erkl_en":"relationships, models, principles"},{"id":"P","de":"Prozedurales Wissen","en":"Procedural","erkl_de":"Verfahren, Techniken, Handlungsfolgen","erkl_en":"methods, techniques, sequences"},{"id":"M","de":"Metakognitives Wissen","en":"Metacognitive","erkl_de":"Wissen über das eigene Vorgehen, Strategiewahl","erkl_en":"knowing one's own approach, choosing strategies"}],"eignung":[{"r":0,"de":"ungeeignet","en":"not suitable","zeichen":"✕"},{"r":1,"de":"manchmal geeignet","en":"sometimes suitable","zeichen":"~"},{"r":2,"de":"gut geeignet","en":"well suited","zeichen":"✓"}],"aufwand":[{"r":1,"de":"gering","en":"low"},{"r":2,"de":"mittel","en":"medium"},{"r":3,"de":"hoch","en":"high"}],"gruppen":[{"id":"material","de":"Materialien","en":"Resources"},{"id":"aktivitaet","de":"Aktivitäten","en":"Activities"},{"id":"ki","de":"KI-Werkzeuge","en":"AI tools"}],"reife":{"einsatz":{"de":"im Einsatz","en":"in use"},"pilot":{"de":"Pilot","en":"pilot"},"konzept":{"de":"Konzept","en":"concept"},"methode":{"de":"Methode","en":"method"}},"kurs210":null,"hinweise":{"lesen_de":"Wählen Sie, was Lernende tun sollen: eine Wissensart und eine Prozessstufe. Die Übersicht zeigt, welche Werkzeuge dafür taugen. Ein Werkzeug gilt für eine Zelle als so gut geeignet wie die schwächere seiner beiden Einstufungen.","lesen_en":"Choose what learners should do: a type of knowledge and a cognitive process. The guide shows which tools support it. A tool counts as suitable for a cell as far as the weaker of its two ratings allows.","tpack_de":"TPACK fragt, ob Technik (T), Lehrmethode (P) und Fachinhalt (C) zusammenpassen. Hier steht TK für Aufwand und Voraussetzungen, TPK für die Lernhandlung, die das Werkzeug ermöglicht, und TCK für ein Fachbeispiel. Ob alles zusammen passt, entscheiden Sie für Ihr Fach.","tpack_en":"TPACK asks whether technology (T), teaching method (P) and content (C) fit together. Here TK stands for effort and prerequisites, TPK for the learning action the tool enables, TCK for a subject example. Whether it all fits is your call for your subject.","urteil_de":"Die Einstufungen sind ein begründetes fachliches Urteil, keine Messung. Kein Werkzeug erzeugt von selbst eine Lernhandlung: Entscheidend ist der Arbeitsauftrag.","urteil_en":"The ratings are a reasoned professional judgement, not a measurement. No tool creates a learning action by itself: the task is what matters.","ki_de":"Nur von der Hochschule freigegebene KI-Dienste nutzen. Keine personenbezogenen Daten und keine Prüfungsleistungen in externe Dienste geben. Noten vergibt die Lehrperson, nicht die KI.","ki_en":"Only use AI services approved by the university. Do not put personal data or exam work into external services. Grades are given by the teacher, not by the AI."},"quellen":["Lorin W. Anderson und David R. Krathwohl (Hrsg.): A Taxonomy for Learning, Teaching, and Assessing. New York 2001.","Punya Mishra und Matthew J. Koehler: Technological Pedagogical Content Knowledge. Teachers College Record 108, Nr. 6 (2006): 1017–1054.","KIViAzubi (FKZ 13HAW013FQ), Phasenabschlussbericht „Vier Blicke auf einen Kurs“, Schicht A, HSD/ZWEK 2026.","Moodle Tool Guide: Idee Joyce Seitzinger, erweitert von Gavin Henrick, deutsche Übertragung Ralf Hilgenstock, Susanne Gebauer, Gerald Hartwig; Anpassung FH Düsseldorf FB 6 von Christian-Maximilian Steier (2013), CC BY-NC-SA."],"werkzeuge":[{"id":"datei","gruppe":"material","aufwand":1,"name":{"de":"Datei und Verzeichnis","en":"File and folder"},"kurz":{"de":"Dokumente bereitstellen (PDF, Folien, Skripte)","en":"Provide documents (PDF, slides, scripts)"},"tk":{"de":"Per Drag & Drop in den Kursraum ziehen.","en":"Drag and drop into the course."},"tpk":{"de":"Verteilt Inhalte in eine Richtung. Eine Lernhandlung entsteht erst durch einen Arbeitsauftrag.","en":"Distributes content one way. A learning action only arises from a task."},"tck":{"de":"Formelsammlung als PDF mit Leseauftrag: „Markieren Sie alle Zustandsgrößen.“","en":"Formula sheet as PDF with a reading task: “Mark every state variable.”"},"stufen":[{"r":2,"de":"Nachschlagen und wiederholen","en":"Look up and revise"},{"r":1,"de":"nur mit Leseauftrag","en":"only with a reading task"},{"r":0,"de":"Lernende handeln hier nicht: Aufgabe oder Test","en":"learners do not act here: assignment or quiz"},{"r":0,"de":"besser: Forum oder Aufgabe","en":"better: forum or assignment"},{"r":0,"de":"besser: Gegenseitige Beurteilung","en":"better: workshop"},{"r":0,"de":"besser: Aufgabe oder Wiki","en":"better: assignment or wiki"}],"wissen":[2,1,1,0],"icon":"folder"},{"id":"textseite","gruppe":"material","aufwand":1,"name":{"de":"Textseite und Buch","en":"Page and book"},"kurz":{"de":"Texte, Bilder und Videos direkt in Moodle; das Buch gliedert in Kapitel","en":"Text, images and video directly in Moodle; the book adds chapters"},"tk":{"de":"Im Editor schreiben; Bilder und Videos einbetten.","en":"Write in the editor; embed images and videos."},"tpk":{"de":"Strukturiert Inhalte. Mit eingebetteten H5P-Fragen wird Lesen aktiv.","en":"Structures content. Embedded H5P questions turn reading into activity."},"tck":{"de":"Buch „Ideale Gase“ mit einem Kapitel je Zustandsänderung.","en":"Book “Ideal gases” with one chapter per change of state."},"stufen":[{"r":2,"de":"Begriffe übersichtlich darstellen","en":"Present terms clearly"},{"r":2,"de":"Erklärungen Kapitel für Kapitel","en":"Explanations chapter by chapter"},{"r":0,"de":"besser: Test oder Lektion","en":"better: quiz or lesson"},{"r":0,"de":"besser: Forum oder Aufgabe","en":"better: forum or assignment"},{"r":0,"de":"besser: Gegenseitige Beurteilung","en":"better: workshop"},{"r":0,"de":"besser: Wiki oder Aufgabe","en":"better: wiki or assignment"}],"wissen":[2,2,1,0],"icon":"book-open"},{"id":"link","gruppe":"material","aufwand":1,"name":{"de":"Link, z. B. auf eine Simulation","en":"Link, e.g. to a simulation"},"kurz":{"de":"Externe Seiten, Simulationen und Werkzeuge einbinden","en":"Include external pages, simulations and tools"},"tk":{"de":"Adresse einfügen. Externe Dienste vorher auf Datenschutz prüfen.","en":"Paste the address. Check external services for data protection first."},"tpk":{"de":"Öffnet Simulationen und Rechenwerkzeuge. Ohne Auftrag bleiben sie Beiwerk; das Ergebnis über eine Aufgabe sichern.","en":"Opens simulations and calculators. Without a task they stay decoration; capture the result through an assignment."},"tck":{"de":"Gasgesetz-Simulation mit Auftrag: „Verdoppeln Sie das Volumen und notieren Sie den Druck.“","en":"Gas law simulation with a task: “Double the volume and note the pressure.”"},"stufen":[{"r":1,"de":"Nachschlagewerke verlinken","en":"Link reference works"},{"r":1,"de":"Simulation mit Beobachtungsauftrag","en":"Simulation with an observation task"},{"r":1,"d
